# All tunable settings live here; code reads them via pde_service.config.

data:
  # PDEBench 1D Burgers on DaRUS (doi:10.18419/darus-2986). File ids per viscosity.
  darus_file_ids:
    "0.1": 268185
    "0.01": 281363
  # Layout verified with scripts/inspect_remote_hdf5.py (contiguous float32 '<f4'):
  tensor_offset: 2048
  n_samples_total: 10000
  n_time_total: 201         # tensor time index k <-> t = 0.01 * k  (t-coordinate has one extra entry)
  n_x: 1024
  dt: 0.01
  time_stride: 10           # keep k = 0, 10, ..., 200 -> t = 0.0, 0.1, ..., 2.0
  n_samples: 1200           # first N samples of the file are downloaded
  output_stride: 2          # of the downloaded times, predict every 2nd -> t = 0.2, 0.4, ..., 2.0 (K = 10)
  local_dir: data/pdebench
  split:                    # by sample index, fixed seed, disjoint
    train: 900
    val: 100
    test: 200
    seed: 0

model:
  modes: 16
  width: 64
  n_layers: 4
  grid_size: 256            # spatial downsampling of the 1024 grid for training (stride 4)
  conserve_mean: true       # hard constraint: mean_x u(t) = mean_x u0 (exact for periodic Burgers)

training:
  epochs: 300
  batch_size: 32
  loss: mse                 # with conserve_mean, MSE acts on the fluctuations only; see README
  lr: 0.001
  weight_decay: 1.0e-4
  scheduler_step: 100
  scheduler_gamma: 0.5
  seed: 0
  threads: 2
  run_dir: runs
  artifact_dir: artifacts

api:
  supported_nu: [0.1]
  # Input checks, from scripts/data_stats.py on the 900 nu=0.1 TRAINING initial conditions:
  #   max|u0|: max 3.14, p99 2.39 | mean(u0) in [-1.56, 1.79] | energy above k=16: max 5.1%, p99 1.1%
  max_abs_u0: 3.2           # above -> rejected (HTTP 422): outside the training amplitude range
  warn_abs_u0: 2.4          # above -> warning: only ~1% of training ICs are this large
  mean_range: [-1.6, 1.8]   # outside -> warning: the mean sets the advection speed
  ood_k_cut: 16             # = FNO Fourier modes
  ood_energy_fraction: 0.06 # more energy than this above ood_k_cut -> warning
  # Supported time window per nu: largest output time where the FNO's fluctuation rel. L2 vs
  # PDEBench on the held-out test split is <= 5% (scripts/error_vs_time.py). Later snapshots
  # are still returned but flagged as low confidence.
  reliable_t_max:
    "0.1": 1.0
  log_level: INFO
